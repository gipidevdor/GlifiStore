requirements:
- id: GS-PERF-DREAD-001
  titolo: Resident durable GET reads memory instead of the Segment file
  categoria: performance
  criticita: alta
  stato: implementato
  descrizione: >-
    Durable Stores serve GETs of resident Segments from in-memory images admitted under the Store
    memory reserve (ADR 0045 as amended by ADR 0046). The Writer mirrors each Record into the active
    image before the append and publication; compaction outputs are mirrored while staged; images are
    loaded at open within the reserve. A resident read applies the cold path's CRC32C, identity,
    key/hash and expiry validation without a file read, and completes on the calling thread (embedded
    caller or glifistored Reader) without a disk-read lane when the Record fits the caller's response
    budget. Segments without an image keep the pinned cold path. In glifistored a connection keeps
    up to 32 GET responses in ordered slots behind its oldest cold read, reserved against the output
    watermark and released in request order. Acknowledgement, visibility, recovery authority,
    persistence v1 and wire v2 are unchanged.
  autorita:
  - docs/adr/0045-memory-resident-durable-reads.md
  - docs/adr/0046-unified-memory-reserve.md
  - docs/architecture/residency-model.md
  - docs/architecture/lean-memory-algorithm.md
  - docs/spec/benchmark-standard.md
  - docs/benchmarks/resident-durable-reads-2026-11-15.md
  implementazione:
  - include/glifistore/persistence/segment_image.hpp
  - src/persistence/segment_image.cpp
  - src/persistence/segment_file_io.cpp
  - src/persistence/runtime_catalog.cpp
  - src/persistence/runtime_catalog_mutate_ops.cpp
  - src/persistence/runtime_catalog_rotate_ops.cpp
  - src/persistence/runtime_catalog_compact.cpp
  - src/persistence/compaction_builder.cpp
  - src/persistence/runtime_catalog_read_ops.cpp
  - src/server/reactor_execute.cpp
  - src/server/reactor_dispatch.cpp
  - src/server/reactor.cpp
  - include/glifistore/server/ordered_response_window.hpp
  prove:
  - tests/integration/resident_reads_tests.cpp
  - tests/integration/server_reactor_paired_tests.cpp
  - tests/integration/server_reactor_cold_window_tests.cpp
  - tests/unit/ordered_response_window_tests.cpp
  - tests/unit/memory_reserve_tests.cpp
  - tests/quality/allocation_fault_core_tests.cpp
  - tests/integration/persistence_recovery_tests.cpp
  - tests/integration/persistence_recovery_crash_tests.cpp
  piattaforme: [macos-arm64, linux-x86_64, freebsd-amd64, openbsd-amd64]
  claim_massimo: architectural-prototype
  evidenze: []
  rischio_residuo:
  - >-
    ADR 0045 targets measured locally only (2026-11-15): resident GET is 61% of volatile embedded and
    75-78% in the daemon at pipeline 32, below the 90% and 80% targets
  - A paged-out image page faults on the Reader thread like a paged Index page
  - Resident reads do not re-detect later on-disk corruption (HAZ-042)
  hazards: [HAZ-042]
  gates: [GATE-DURABLE-READS]
- id: GS-OPS-MEMRES-001
  titolo: One memory reserve; the Index is paged, never refused
  categoria: operations
  criticita: alta
  stato: implementato
  descrizione: >-
    memory_reserve_bytes bounds the RAM a durable Store keeps for derived state. The Worker Index is
    charged first and is never refused: arrays beyond the reserve are mapped from an unlinked spill
    file in index_spill_directory, or stay anonymous and swap-pageable when no directory is set.
    The paired Reader index lineage is charged to the same reserve. Resident Segment images are
    admitted only in the remaining budget and evicted oldest-first at rotation, before any
    persistent write, by republishing the generation without its image.
    Allocation failure of an image leaves the Segment cold; no allocation follows a persistent
    publication boundary.
  autorita:
  - docs/adr/0046-unified-memory-reserve.md
  - docs/architecture/lean-memory-algorithm.md
  implementazione:
  - include/glifistore/core/memory_reserve.hpp
  - src/core/memory_reserve.cpp
  - include/glifistore/core/pageable_array.hpp
  - src/index/swiss_table.cpp
  - src/index/key_arena.cpp
  - src/store/paired/read_generation_internals.hpp
  - src/store/paired/read_generation_immutable.hpp
  - src/persistence/runtime_catalog.cpp
  - include/glifistore/store/config.hpp
  prove:
  - tests/unit/memory_reserve_tests.cpp
  - tests/unit/pair_read_generation_tests.cpp
  - tests/integration/resident_reads_tests.cpp
  - tests/quality/allocation_fault_core_tests.cpp
  piattaforme: [macos-arm64, linux-x86_64, freebsd-amd64, openbsd-amd64]
  claim_massimo: architectural-prototype
  evidenze: []
  rischio_residuo:
  - Two paired Reader bases coexist and are both charged while a rebuild is in flight
  - Spill files reserve their blocks before mapping; a full copy-on-write filesystem can still raise SIGBUS (HAZ-043)
  - No measurement of lookup latency with a paged Index
  hazards: [HAZ-043]
  gates: [GATE-DURABLE-READS]
