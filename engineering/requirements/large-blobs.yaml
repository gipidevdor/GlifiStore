# ADR 0042 accepted; implementation is not release acceptance.
requirements:
- id: GS-PERSIST-BLOB-001
  titolo: Versioned external blob format and value-size-independent encoding
  categoria: persistence
  criticita: critica
  stato: implementato
  descrizione: Implement an opt-in persistence family v2 with Blob File v1 and typed BlobRef v1, complete
    little-endian field tables, checked extents, CRC32C and SHA-256. Retain 64 MiB Segments and the 1
    MiB encoded Record bound, support 64 MiB logical values for every accepted key, preserve legacy v1
    Stores, and require old-engine refusal before recovery or namespace mutation. Legacy constants remain
    v1; opt-in profile versions are explicit.
  autorita:
  - docs/adr/0042-large-blob-storage.md
  - docs/spec/large-blob-storage-v1.md
  implementazione:
  - include/glifistore/persistence/blob.hpp
  - src/persistence/blob_codec.cpp
  - src/persistence/manifest.cpp
  - src/segment/record.cpp
  - src/segment/segment_header.cpp
  - src/persistence/compaction_intent.cpp
  prove:
  - tests/unit/blob_storage_tests.cpp
  - scripts/generate_blob_fixtures.py
  - tests/fixtures/blob_ref_v1.hex
  - tests/fixtures/blob_file_v1_metadata.hex
  - tests/fixtures/blob_file_v1_footer.hex
  - tests/fixtures/record_v2_blob_ref.hex
  - tests/fixtures/manifest_v2_blob.hex
  - tests/fixtures/segment_header_v2_prefix.hex
  piattaforme:
  - linux-x86_64
  - macos-arm64
  - freebsd-amd64
  - openbsd-amd64
  claim_massimo: architectural-prototype
  evidenze:
  - path: engineering/evidence/blob-local-2026-11-07.md
    note: Local macOS functional/sanitizer and E2 SIGKILL evidence; allocation CTest timeout retained;
      no CI/release acceptance
  rischio_residuo:
  - Independent fixtures and codecs exist; a retained old released binary / new Store refusal campaign
    remains open
  hazards:
  - HAZ-035
  - HAZ-039
  gates:
  - GATE-BLOB-EMBEDDED
- id: GS-PERSIST-BLOB-002
  titolo: Durable blob dependency before logical descriptor admission
  categoria: persistence
  criticita: critica
  stato: implementato
  descrizione: Implement reserve, stage, verify, strict file sync, non-replacing install and directory
    sync before the owner Writer can admit a BlobRef in any durable policy. Preserve strict sync/group
    ACK-after-durability-and-visibility and periodic descriptor loss semantics. Installed payloads alone
    never establish logical commit, and admitted logical mutations cannot be cancelled by upload abort
    or disconnect.
  autorita:
  - docs/adr/0042-large-blob-storage.md
  - docs/spec/large-blob-storage-v1.md
  implementazione:
  - src/persistence/blob_storage.cpp
  - src/persistence/runtime_catalog_blobs.cpp
  - src/persistence/runtime_catalog_mutate_ops.cpp
  - src/store/store_blob.cpp
  prove:
  - tests/unit/blob_storage_tests.cpp
  - tests/crash/crash_blob.cpp
  piattaforme:
  - linux-x86_64
  - macos-arm64
  - freebsd-amd64
  - openbsd-amd64
  claim_massimo: architectural-prototype
  evidenze:
  - path: engineering/evidence/blob-local-2026-11-07.md
    note: Local macOS functional/sanitizer and E2 SIGKILL evidence; allocation CTest timeout retained;
      no CI/release acceptance
  rischio_residuo:
  - Local process-crash and injected-failure checks do not certify filesystems or devices
  - E3/E4 remains open; exhaustive native I/O failure and scheduler matrices remain unretained
  hazards:
  - HAZ-035
  gates:
  - GATE-BLOB-EMBEDDED
- id: GS-RECOVERY-BLOB-001
  titolo: Fail-closed recovery of the complete historical blob closure
  categoria: recovery
  criticita: critica
  stato: implementato
  descrizione: Implement deterministic recovery from accepted Manifest/intent candidates and selected
    committed Segment extents. Verify every referenced blob, including historical and expired descriptors,
    before service. Never adopt an orphan or fall back to an older value when a committed descriptor's
    payload is missing, truncated or corrupt. Keep identity allocation monotonic and recovery work within
    configured count/byte budgets.
  autorita:
  - docs/adr/0042-large-blob-storage.md
  - docs/spec/large-blob-storage-v1.md
  implementazione:
  - src/persistence/blob_recovery.cpp
  - src/persistence/runtime_catalog.cpp
  - src/persistence/namespace_audit.cpp
  prove:
  - tests/unit/blob_storage_tests.cpp
  - tests/crash/crash_blob.cpp
  piattaforme:
  - linux-x86_64
  - macos-arm64
  - freebsd-amd64
  - openbsd-amd64
  claim_massimo: architectural-prototype
  evidenze:
  - path: engineering/evidence/blob-local-2026-11-07.md
    note: Local macOS functional/sanitizer and E2 SIGKILL evidence; allocation CTest timeout retained;
      no CI/release acceptance
  rischio_residuo:
  - Native Linux/BSD qualification, recovery-scale campaigns and tagged compatibility remain open
  hazards:
  - HAZ-035
  - HAZ-036
  - HAZ-039
  gates:
  - GATE-BLOB-EMBEDDED
- id: GS-CONCUR-BLOB-001
  titolo: Blob publication ownership, stable reads and conservative reclamation
  categoria: concurrency
  criticita: critica
  stato: implementato
  descrizione: Implement Writer sequence order after blob preparation, stable per-version streaming leases,
    bounded late-completion ownership and terminal shutdown. GC must retain every recovery, pending append/group/periodic-flush,
    publication, Reader and backup root and serialize final deletion with acquisition of new roots. Compaction
    cannot retire old blob roots before its Manifest transition is durable and Reader quiescence is satisfied.
  autorita:
  - docs/adr/0042-large-blob-storage.md
  - docs/spec/large-blob-storage-v1.md
  implementazione:
  - src/persistence/blob_storage.cpp
  - src/store/store_blob.cpp
  - src/store/paired/shard_pair_runtime.cpp
  - src/store/paired/shard_pair_runtime_sync_lane.cpp
  - src/store/paired/shard_pair_runtime_writer_sync.cpp
  prove:
  - tests/unit/blob_storage_tests.cpp
  - tests/unit/blob_lifecycle_tests.cpp
  piattaforme:
  - linux-x86_64
  - macos-arm64
  - freebsd-amd64
  - openbsd-amd64
  claim_massimo: architectural-prototype
  evidenze:
  - path: engineering/evidence/blob-local-2026-11-07.md
    note: Local macOS functional/sanitizer and E2 SIGKILL evidence; allocation CTest timeout retained;
      no CI/release acceptance
  rischio_residuo:
  - Long adversarial Reader/GC/backup and multi-shard scheduling campaigns remain open
  hazards:
  - HAZ-036
  gates:
  - GATE-BLOB-EMBEDDED
- id: GS-CORE-BLOB-001
  titolo: Bounded streaming API and logical inline/blob equivalence
  categoria: core
  criticita: alta
  stato: implementato
  descrizione: Implement logical single-item PUT/GET/ERASE equivalence, optional expected size, terminal
    handle-local commit idempotence, validated EOF, Store-scoped streaming handles and unchanged owning-read
    lifetime. Limit engine-owned transfer memory to 4 MiB, two payload buffers, finite global/per-shard
    slots and reserved credits. Account materializing GET separately and reject unsupported surfaces before
    effects.
  autorita:
  - docs/adr/0042-large-blob-storage.md
  - docs/spec/large-blob-storage-v1.md
  implementazione:
  - include/glifistore/store/blob.hpp
  - include/glifistore/store/config.hpp
  - src/store/store_blob.cpp
  - src/persistence/blob_storage.cpp
  prove:
  - tests/unit/blob_storage_tests.cpp
  - tests/unit/blob_lifecycle_tests.cpp
  piattaforme:
  - linux-x86_64
  - macos-arm64
  - freebsd-amd64
  - openbsd-amd64
  claim_massimo: architectural-prototype
  evidenze:
  - path: engineering/evidence/blob-lifecycle-local-2026-11-07.md
    note: Local terminal cleanup, staging quota and sync-hook regressions only
  - path: engineering/evidence/blob-local-2026-11-07.md
    note: Local macOS functional/sanitizer and E2 SIGKILL evidence; allocation CTest timeout retained;
      no CI/release acceptance
  rischio_residuo:
  - Streaming credits and bounded buffers are implemented; complete allocation census and adversarial
    saturation qualification remain open
  hazards:
  - HAZ-037
  gates:
  - GATE-BLOB-EMBEDDED
- id: GS-OPS-BLOB-001
  titolo: Blob-aware backup, verification and physical-space accounting
  categoria: operations
  criticita: critica
  stato: implementato
  descrizione: Implement fenced backup of the complete descriptor closure, pinned source files, destination
    Manifest publication last and full destination verification. Require unsupported tools to refuse v2
    before mutation, distinguish all physical space classes and permit budgeted descriptor compaction
    for blob gain without Segment gain, including early rotation and separately reserved maintenance credits
    under blob debt.
  autorita:
  - docs/adr/0042-large-blob-storage.md
  - docs/spec/large-blob-storage-v1.md
  implementazione:
  - src/persistence/blob_recovery.cpp
  - src/persistence/store_backup.cpp
  - src/persistence/store_verify.cpp
  - src/persistence/compaction_builder.cpp
  - src/persistence/compaction/planner.cpp
  prove:
  - tests/unit/blob_storage_tests.cpp
  piattaforme:
  - linux-x86_64
  - macos-arm64
  - freebsd-amd64
  - openbsd-amd64
  claim_massimo: architectural-prototype
  evidenze:
  - path: engineering/evidence/blob-local-2026-11-07.md
    note: Local macOS functional/sanitizer and E2 SIGKILL evidence; allocation CTest timeout retained;
      no CI/release acceptance
  rischio_residuo:
  - Repair/migrate refuse v2; daemon and SDK enablement remain deferred
  - Offline blob verification/backup use default blob file/byte budgets; extended operator-budget tooling
    and full telemetry remain open
  hazards:
  - HAZ-036
  - HAZ-038
  gates:
  - GATE-BLOB-EMBEDDED
- id: GS-PERF-BLOB-001
  titolo: Controlled inline non-regression and blob saturation evidence
  categoria: performance
  criticita: alta
  stato: normativo
  descrizione: Specify same-source controlled A/B for inline workloads, with initial proposed budgets
    of at most 3 percent median throughput loss and 5 percent p99 increase, no blob allocation/hash on
    inline operations, and separate p99.9/memory/GC-debt reporting. Predeclare noise/confidence rules
    and exercise hot-key skew, disk saturation, slow streams and compaction overlap before accepting any
    performance claim.
  autorita:
  - docs/adr/0042-large-blob-storage.md
  - docs/spec/large-blob-storage-v1.md
