  - freebsd-amd64
  - openbsd-amd64
  claim_massimo: architectural-prototype
  evidenze: []
  rischio_residuo:
  - No blob benchmark or inline A/B has been executed; budgets are proposed
  hazards:
  - HAZ-037
  gates:
  - GATE-BLOB-EMBEDDED
- id: GS-PROTO-BLOB-001
  titolo: Separate negotiated bounded blob transfer and retry-resolution contract
  categoria: protocol
  criticita: alta
  stato: normativo
  descrizione: Require a later accepted wire/SDK contract before enabling blob-capable daemon Stores.
    Specify capability negotiation, old-client outcomes, chunk flow control, owner binding, authentication/authorization,
    transfer expiry and bounded persistent retry resolution. Do not allocate opcodes, enlarge wire v2
    frames or infer durable idempotence from an embedded handle or an installed blob file.
  autorita:
  - docs/adr/0042-large-blob-storage.md
  - docs/spec/large-blob-storage-v1.md
  implementazione: []
  prove: []
  piattaforme:
  - linux-x86_64
  - macos-arm64
  - freebsd-amd64
  - openbsd-amd64
  claim_massimo: architectural-prototype
  evidenze: []
  rischio_residuo:
  - Wire opcodes, SDK/C ABI integration and persistent retry resolution are deferred
  hazards:
  - HAZ-037
  - HAZ-039
  gates:
  - GATE-BLOB-WIRE
