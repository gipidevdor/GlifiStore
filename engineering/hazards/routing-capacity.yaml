hazards:
- id: HAZ-045
  evento_pericoloso: A hot shard saturates while other shard pairs retain unused capacity
  cause:
  - Fixed key ownership and no runtime load redistribution (ADR 0033)
  - A hot key or asymmetric request distribution concentrates work on one Reader or Writer
  conseguenze:
  - Throughput is limited by the hot shard rather than aggregate CPU capacity
  - Tail latency and bounded-lane backpressure increase for traffic targeting that owner
  severita: alta
  probabilita: media
  rilevabilita: alta
  prevenzione:
  - Logical ownership stays fixed; the opt-in volatile helper prototype shares read execution only
  - ADR 0048 removes intermediate materialization of small volatile GET values within the Reader lease
  - ADR 0049 implements bounded experimental helpers and control; no capacity profile is qualified
  contenimento:
  - Bounded lanes constrain queued work but do not redistribute it
  prove:
  - tests/unit/benchmark_owner_workload_tests.cpp
  - scripts/tests/test_owner_capacity_report.py
  - tests/unit/pair_read_generation_tests.cpp
  - tests/integration/server_reactor_mutation_window_tests.cpp
  - engineering/evidence/owner-capacity-local-2026-11-21/README.md
  - engineering/evidence/hot-reader-copy-local-2026-11-21/README.md
  rischio_residuo: >-
    Open capacity limitation. The retained local Release exploration on 2026-11-21 compares
    75 and 90 percent finite total-work allocations with balanced client bindings. It validates
    the measurement tooling, not sustained offered-load saturation or sibling isolation: cold
    clients can finish early. Ten-client rows have a 14-thread foreground floor on 10 logical
    CPUs and remain oversubscription sensitivity observations. Single-hot-key contention,
    per-owner CPU/queue decomposition, long overlap and native Linux/BSD campaigns are pending.
    A shard pair is not a single CPU core. Offline migration is not runtime balancing and does
    not by itself resolve a single hot key. ADR 0048's local old/candidate/old comparison shows a
    reduction in Reader copy work (about 9 percent for the hot-owner 1 KiB GET case), not runtime
    redistribution or a general tail-latency improvement. ADR 0049 now has an opt-in volatile
    implementation with local deterministic and lifetime proofs. It is disabled by default;
    fixed-helper pilots do not qualify coupled capacity curves, thresholds, isolation or CPU cost.
    Revised 65/45 percent candidates remain hypotheses, not measured capacity or cost claims.
    Compaction sustainability remains separate.
  stato: aperto
  accettazione_rischio: Not accepted for release; fixed-owner capacity limit remains unresolved
  requisiti: [GS-CONCUR-PAIR-001, GS-PERF-OWNER-001, GS-PERF-VREAD-001, GS-PERF-RCAP-001, GS-OPS-RCTRL-001]
- id: HAZ-046
  evento_pericoloso: Client routing mismatch rejects requests without server-side forwarding
  cause:
  - INIT is followed by one BIND_WORKER binding the connection to one owner
  - A request key belongs to a different owner from the bound connection
  conseguenze:
  - The server returns WRONG_OWNER instead of executing or forwarding the request
  - Clients must manage owner-specific routing and connections; mismatch can interrupt application work
  severita: media
  probabilita: media
  rilevabilita: alta
  prevenzione:
  - Clients use the routing identity and owner metadata defined by wire v2
  contenimento:
  - Wrong-owner requests are rejected rather than applied to the wrong shard
  - Official clients mark the client unhealthy under client-semantics-v1
  prove:
  - tests/unit/read_capacity_controller_tests.cpp
  - tests/integration/server_read_helper_tests.cpp
  - scripts/tests/test_benchmark_read_capacity.py
  rischio_residuo: >-
    Open integration limitation of the current routing contract, not a claim that
    WRONG_OWNER violates wire v2. Connection management and recovery remain client
    responsibilities. The availability and connection-cost impact needs measurement;
    no transparent forwarding, automatic reroute or retry guarantee is introduced.
    A solution remains to be studied separately from online rebalancing.
  stato: aperto
  accettazione_rischio: Not accepted for release; problem recorded only, solution deferred
  requisiti: [GS-PROTO-WIRE-001]
- id: HAZ-047
  evento_pericoloso: An opt-in adaptive read controller amplifies overload or starves other owners and Writers
  cause:
  - Treating completed throughput or total CPU occupancy as sufficient evidence of useful read capacity
  - Independent per-owner pools oversubscribe the process or retain credits while parked or draining
  - Scale-down ignores capacity with one fewer helper, causing repeated expansion and retirement
  - A hot owner monopolizes helpers or controller delays exceed the workload's burst tolerance
  - Coupled service capacities and measurement delays are treated as independent fixed per-owner rates
  conseguenze:
  - Additional CPU and queues increase latency without increasing useful completed work
  - Writer, maintenance or sibling progress is reduced and read generations can remain retained
  severita: alta
  probabilita: media
  rilevabilita: alta
  prevenzione:
  - Accepted ADR 0049 implements a pure controller, local observations, a shared CPU target and rigid cells
  - Counterfactual retirement, equal-weight arbitration and unknown or stale measurements have deterministic tests
  contenimento:
  - Default cap is zero; unknown profiles park helpers; fixed allocations require explicit configuration
  - Reassignment drains occupied cells; full pools fall back to the primary; helpers join before Store teardown
  prove:
  - tests/unit/read_capacity_controller_tests.cpp
  - tests/integration/server_read_helper_tests.cpp
  - scripts/tests/test_benchmark_read_capacity.py
  rischio_residuo: >-
    Experimental feature, disabled by default. Local deterministic and lifetime tests do not
    establish sustained benefit, calibrated thresholds, workload-independent stability, coupled
    multi-owner capacities or weighted CPU-cost fairness. Helper handoff safety is tested locally
    for ordinary and slot-pool generations; adversarial soaks/platform qualification remain open.
    Resource economics must be measured before enabling an automatic profile. HAZ-008 also applies.
  stato: aperto
  accettazione_rischio: Not accepted for release; experimental local implementation, qualification pending
  requisiti: [GS-PERF-RCAP-001, GS-OPS-RCTRL-001]
