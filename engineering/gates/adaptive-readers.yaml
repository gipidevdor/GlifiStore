gates:
- id: GATE-ADAPTIVE-READERS
  titolo: Adaptive read capacity preserves ownership, bounded resources and useful progress
  sezione: verification
  livello_rilascio: prototype
  requisiti: [GS-PERF-RCAP-001, GS-CONCUR-PAIR-001, GS-CONCUR-MEM-001, GS-OPS-RCTRL-001, GS-CONCUR-RHELP-001]
  prove:
  - tests/unit/read_capacity_controller_tests.cpp
  - tests/integration/server_read_helper_tests.cpp
  - scripts/tests/test_benchmark_read_capacity.py
  piattaforme: [macos-arm64, linux-x86_64, freebsd-amd64, openbsd-amd64]
  evidenze:
  - path: engineering/evidence/read-capacity-local-2026-11-21/README.md
    note: Local opt-in prototype proofs; capacity and platform qualification remain open
  stato: IMPLEMENTATA
  rischio_residuo: >-
    ADR 0049 accepts the opt-in prototype. Default helper cap is zero; unknown profiles never
    activate adaptive helpers. Local credit, replay, equal-share and epoch-handoff proofs do
    not qualify capacity, thresholds, CPU cost, global stability or starvation freedom under
    arbitrary workload changes. All native platform acceptance rows and sustained multi-owner
    campaigns remain pending. HAZ-045/046/047 are not accepted for release.
  riapertura:
  - Claiming capacity from completed throughput alone or an incompatible workload profile
  - Helper activation without a global budget, safe registration or byte/completion credits
  - Reclamation before all borrowers quiesce, early release of draining credits or stale-owner reuse
  - Scale-down based solely on current utilization, starvation or unbounded control-path work
  - Changed routing, mutation visibility, client rejection or retry behavior without authority
  narrative: >-
    A bounded shared helper prototype extends the originating Reader epoch frontier through
    exact-selection continuations. Pure control decisions have deterministic replay and hard
    credit tests. Fixed-allocation offered-rate experiments are explicitly unqualified; metadata
    checks and local tests do not close the sustained performance or release obligations.
