  - tests/integration/paired_store_erase_batch_volatile_litmus_tests.cpp
  - tests/fixtures/error_taxonomy_v1.json
  - tests/integration/server_reactor_security_tests.cpp
  - tests/integration/server_reactor_durable_lifecycle_tests.cpp
  - tests/integration/server_reactor_durable_wire_tests.cpp
  - engineering/formal/shard_pair/ShardPair.tla
  piattaforme:
  - linux-x86_64
  - macos-arm64
  evidenze:
  - workflow: ci.yml
  - workflow: formal-models.yml
  stato: PROVATA_IN_CI
  rischio_residuo: Formal model bounds and declared fairness do not prove real scheduler fairness;
    checker history size bounded; admitted Store mutations remain non-cancellable by disconnect/timeout
    (by design); durable_group/periodic flusher token sharing deferred; adversarial multi-hour combiner
    fairness evidence open
  riapertura:
  - Execution-token or combining semantics change without ADR 0037 amendment
  - ACK boundary / mutation visibility change without ADR + GATE-DURABLE-ACK evidence
  - Visibility or borrow lifetime change without ADR
  - legacy_mutex feature creep without policy update
  - Daemon request-timeout policy change without client-semantics / wire update
  narrative: Client semantics, error taxonomy, concurrency model (including ADR 0037 token combining
    Phases A–C), B1 checker/hooks/TLA+, legacy_mutex policy, and daemon request/idle timeout (no
    cancel of admitted Store work) are normative. Phase C daemon mutation windows (≤32) and GET
    visibility barrier are proven by mutation_window_tests plus server_reactor_mutation_window_tests
    (contiguous PUT window/resume, PUT→ERASE→GET, durable_sync GET/PING barriers).
