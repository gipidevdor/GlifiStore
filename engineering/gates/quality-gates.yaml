  - linux-x86_64
  - macos-arm64
  evidenze:
  - workflow: durability-evidence.yml
  stato: PROVATA_IN_CI
  rischio_residuo: No native filesystem row has E3/E4 certification; ADR 0037 durable_sync
    combiner shares ACK-after-visibility with the dedicated Writer path
  riapertura:
  - ACK boundary change
  - e3_certified=yes without pinned campaign
  narrative: E2 evidence present; physical E3 honesty enforced by rehearsal scripts.
    Embedded durable_sync may combine under the execution token (ADR 0037 Phase B) without
    changing ACK-after-visibility polarity. Durable erase_batch tombstones across reopen are
    covered by paired_store_erase_batch_durable_litmus_tests for embedded and Writer-path
    durable_sync / durable_periodic, and Writer-path durable_group (no claim-ceiling change).
