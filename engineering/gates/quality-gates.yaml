  rischio_residuo: Admission is wired fail-closed for tool execution and retains blockers;
    Linux nightly 34666166603 retained package-installed cross-SDK PASS for deb and rpm, but
    admitted stays false until package-upgrade is exercised against a sealed SemVer N-1
    predecessor on required backends; Linux, FreeBSD/OpenBSD, and MacPorts/Homebrew implement
    install→seed→upgrade→verify when GLIFISTORE_N1_PACKAGE_DIR supplies those bytes (never
    rebuilt from HEAD), but no prior annotated release exists yet so the check stays
    NOT_APPLICABLE_INITIAL_BASELINE; no annotated release has retained a positive admission yet
  riapertura:
  - Selecting an N-1 baseline by arithmetic instead of SemVer precedence over sealed releases
  - Rebuilding an N-1 package from HEAD or admitting a draft/incomplete predecessor
  - Claiming an initial baseline while a published predecessor exists
  - Admitting package bytes that the artifact manifest does not record with the same digest
  - Rounding a BLOCKED admission report up to a publishable PASS without residual closure
  narrative: The baseline resolver orders annotated published releases by SemVer precedence, keeps only
    complete sealed ABI-compatible candidates, and separates NOT_APPLICABLE_INITIAL_BASELINE, BLOCKED
    and NOT_RUN; admission binds the artifact manifest to the sealed source digest and every evidence
    subject to the exact bytes, reporting blockers instead of promoting anything. package-ci.yml and
    release.yml invoke run_package_admission.py and retain the report. Cross-SDK package-installed
    PASS is retained for deb/rpm nightly; positive admission remains open until a sealed N-1
    package-upgrade PASS exists on required backends. Linux, FreeBSD/OpenBSD, and
    MacPorts/Homebrew implement that walk when sealed predecessor packages (or macOS
    source archives) are supplied; a retained PASS still requires published N-1 bytes.
