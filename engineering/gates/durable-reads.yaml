gates:
- id: GATE-DURABLE-READS
  titolo: Memory-resident durable reads and a pageable Index under one reserve
  sezione: durability_recovery
  livello_rilascio: prototype
  requisiti: [GS-PERF-DREAD-001, GS-OPS-MEMRES-001]
  prove:
  - tests/integration/resident_reads_tests.cpp
  - tests/unit/memory_reserve_tests.cpp
  - tests/quality/allocation_fault_core_tests.cpp
  piattaforme: [macos-arm64, linux-x86_64, freebsd-amd64, openbsd-amd64]
  evidenze: []
  stato: IMPLEMENTATA
  rischio_residuo: >-
    ADR 0045 and ADR 0046 are proposed. The embedded path reads resident Segments from memory;
    glifistored still hops to the cold-read executor. Benchmarks against the ADR 0045 targets, TSan
    eviction runs and charging of the paired Reader index are outstanding.
  riapertura:
  - Any change to acknowledgement, visibility or recovery authority to obtain read speed
  - Image unmap not governed by generation reclamation
  - Resident read path that skips any cold-path validation
  - Index growth refused because of the memory reserve
  - An allocation after a persistent publication boundary
  narrative: >-
    Acceptance requires the ADR 0045 verification list as amended by ADR 0046: RAW litmus across
    residency states, eviction under ASan/TSan, recovery below the reserve, allocation faults with and
    without images and same-host A/B targets.
