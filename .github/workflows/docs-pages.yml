name: C++ documentation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "include/**"
      - "src/**"
      - "docs/**"
      - "engineering/**"
      - "artwork/apple/raster/glifistore-app-icon-128.png"
      - "scripts/build_docs.py"
      - "scripts/tests/test_build_docs.py"
      - "CMakeLists.txt"
      - "VERSION"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate Doxygen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake doxygen
      - name: Check documentation tooling
        run: python3 -m unittest scripts.tests.test_build_docs
      - name: Configure documentation only
        env:
          DOCS_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          DOCS_REVISION: ${{ github.sha }}
        run: >-
          cmake -S docs/doxygen -B build/docs
          -DGLIFISTORE_DOCS_SOURCE_URL="$DOCS_SOURCE_URL"
          -DGLIFISTORE_DOCS_REVISION="$DOCS_REVISION"
      - name: Generate reference and check local site links
        run: cmake --build build/docs --target glifistore-docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: build/docs/html

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
