name: Formal models (TLC)

on:
  push:
    branches: [main]
    paths:
      - "engineering/formal/**"
      - "engineering/requirements/concurrency.yaml"
      - "engineering/requirements/persistence.yaml"
      - "engineering/gates/quality-gates.yaml"
      - "include/glifistore/persistence/**"
      - "include/glifistore/store/paired/**"
      - "src/persistence/**"
      - "src/store/paired/**"
      - "tests/crash/**"
      - "tests/concurrency/**"
      - "docs/spec/concurrency-memory-model.md"
      - "docs/spec/persistence-v1.md"
      - "docs/spec/recovery-state-matrix-v1.md"
      - ".github/workflows/formal-models.yml"
  pull_request:
    paths:
      - "engineering/formal/**"
      - "engineering/requirements/concurrency.yaml"
      - "engineering/requirements/persistence.yaml"
      - "engineering/gates/quality-gates.yaml"
      - "include/glifistore/persistence/**"
      - "include/glifistore/store/paired/**"
      - "src/persistence/**"
      - "src/store/paired/**"
      - "tests/crash/**"
      - "tests/concurrency/**"
      - "docs/spec/concurrency-memory-model.md"
      - "docs/spec/persistence-v1.md"
      - "docs/spec/recovery-state-matrix-v1.md"
      - ".github/workflows/formal-models.yml"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc:
    name: TLC ${{ matrix.label }} (bounded, required)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ShardPair
            model: shard_pair
          - label: PersistenceRecovery
            model: persistence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Download and verify tla2tools.jar
        run: |
          # Pin the asset ID as well as its digest: the v1.8.0 tag is republished.
          # Asset metadata and downloaded bytes verified on 2026-11-01.
          curl -fsSL -H 'Accept: application/octet-stream' -o /tmp/tla2tools.jar \
            "https://api.github.com/repos/tlaplus/tlaplus/releases/assets/692577622"
          echo "011267fca25d0752cf18894dd585cd28b96960c112ea8a20b823ea770e7e10cd  /tmp/tla2tools.jar" \
            | sha256sum -c -
          echo "TLA2TOOLS_JAR=/tmp/tla2tools.jar" >> "$GITHUB_ENV"
      - name: Run bounded TLC model
        run: timeout 480 "./engineering/formal/${{ matrix.model }}/run-tlc.sh"
