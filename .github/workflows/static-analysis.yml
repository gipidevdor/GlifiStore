name: Static analysis

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install pinned formatter and build tools
        run: python -m pip install --disable-pip-version-check cmake ninja "clang-format==$(cat .clang-format-version)"
      - name: Check all native source formatting
        run: python engineering/tools/format_code.py --check
      - name: Install Clang tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Configure with clang-tidy
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset unix-clang-tidy
      - name: Build with analysis
        run: cmake --build --preset unix-clang-tidy
      - name: Fail closed on high-signal production diagnostics
        run: python engineering/tools/run_clang_tidy_gate.py --build-dir build/unix-clang-tidy
