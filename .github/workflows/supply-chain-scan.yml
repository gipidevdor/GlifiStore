name: Supply chain scan

# Phase 7.1: dependency + secret scanning on main / PRs (signing still separate).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: supply-chain-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Full-history detect (not push-range): gitleaks-action builds
      # `oldest^..HEAD`, which fails when oldest is a root commit after a
      # history rewrite (no parent object).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Detect secrets
        run: gitleaks detect --source . --verbose --redact --exit-code=1

  dependencies:
    name: Dependency scan (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - name: Upload Trivy SARIF
        if: ${{ always() && vars.GLIFISTORE_UPLOAD_SARIF == 'true' }}
        # The Trivy scan above remains the blocking security gate. Publishing
        # is opt-in because code scanning may be disabled even when the token
        # has security-events access. Enable the repository variable only when
        # the Code Scanning endpoint is available.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
